services:
  api:
    build: .
    container_name: clauseguard_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://clauseguard:clauseguard_secret@postgres:5432/clauseguard
      - DATABASE_SYNC_URL=postgresql+psycopg2://clauseguard:clauseguard_secret@postgres:5432/clauseguard
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: .
    container_name: clauseguard_celery
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://clauseguard:clauseguard_secret@postgres:5432/clauseguard
      - DATABASE_SYNC_URL=postgresql+psycopg2://clauseguard:clauseguard_secret@postgres:5432/clauseguard
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    container_name: clauseguard_postgres
    environment:
      POSTGRES_DB: clauseguard
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: clauseguard_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard -d clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clauseguard_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: clauseguard_prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  pgdata:
  redisdata:
