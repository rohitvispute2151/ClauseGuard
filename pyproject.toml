[project]
name = "clauseguard"
version = "0.1.0"
description = "ClauseGuard - Contract Review API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "pypdf>=4.3.0",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "prometheus-client>=0.20.0",
    "rapidfuzz>=3.9.0",
    "alembic>=1.13.2",
    "tiktoken>=0.7.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
